<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페인 매니저 - 내 건강 지킴이</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { margin: 0; color: #2c3e50; font-size: 24px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-login { background-color: #4285F4; color: white; }
        .btn-logout { background-color: #e74c3c; color: white; display: none; }
        
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .section { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        
        /* 검색부 */
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"], select, input[type="number"], input[type="time"] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 100%; }
        
        /* 음료 결과 카드 */
        .drink-card { display: flex; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 10px; align-items: center; gap: 15px; }
        .drink-img { width: 80px; height: 80px; object-fit: cover; border-radius: 5px; background: #ddd; }
        .drink-info h3 { margin: 0 0 5px 0; }
        .drink-info p { margin: 2px 0; font-size: 14px; color: #555; }
        
        /* 대시보드 (로그인 시 표출) */
        #dashboard { display: none; }
        .record-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #e8f4f8; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-box h4 { margin: 0 0 5px 0; color: #2980b9; }
        .stat-box span { font-size: 20px; font-weight: bold; }
        
        .recommendation { background: #fff3cd; padding: 15px; border-left: 5px solid #ffc107; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ 카페인 매니저</h1>
        <div>
            <button id="loginBtn" class="btn btn-login" onclick="toggleLogin()">Google 계정으로 로그인</button>
            <button id="logoutBtn" class="btn btn-logout" onclick="toggleLogin()">로그아웃</button>
        </div>
    </header>

    <div class="container">
        <!-- 음료 검색 섹션 (모두에게 보임) -->
        <div class="section">
            <h2>🔍 시판 음료 검색</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="음료 이름 검색 (예: 핫식스, 몬스터, 아메리카노)">
                <button class="btn" style="background:#2c3e50; color:white;" onclick="searchDrink()">검색</button>
            </div>
            <div id="searchResults">
                <p style="color:#777;">음료를 검색하면 영양 정보와 사진이 표시됩니다.</p>
            </div>
        </div>

        <!-- 개인 기록 대시보드 (로그인 시 보임) -->
        <div class="section" id="dashboard">
            <h2>📊 내 일주일 카페인 기록</h2>
            
            <div class="record-form">
                <strong>📝 음료 마신 기록 추가하기</strong>
                <select id="drinkSelect">
                    <option value="핫식스">핫식스 (250ml)</option>
                    <option value="몬스터 에너지">몬스터 에너지 (355ml)</option>
                    <option value="아이스 아메리카노">아이스 아메리카노</option>
                    <option value="박카스">박카스 F</option>
                </select>
                <div style="display:flex; gap:10px;">
                    <select id="daySelect">
                        <option value="월">월요일</option><option value="화">화요일</option>
                        <option value="수">수요일</option><option value="목">목요일</option>
                        <option value="금">금요일</option><option value="토">토요일</option>
                        <option value="일">일요일</option>
                    </select>
                    <input type="number" id="countInput" min="1" value="1" placeholder="몇 캔/잔?">
                    <input type="time" id="timeInput">
                </div>
                <button class="btn" style="background:#27ae60; color:white;" onclick="addRecord()">기록하기</button>
            </div>

            <h3>이번 주 누적 섭취량</h3>
            <div class="stats-grid">
                <div class="stat-box"><h4>총 카페인</h4><span id="totalCaffeine">0</span> mg</div>
                <div class="stat-box"><h4>총 당류</h4><span id="totalSugar">0</span> g</div>
                <div class="stat-box"><h4>총 칼로리</h4><span id="totalCalories">0</span> kcal</div>
                <div class="stat-box"><h4>총 지출</h4><span id="totalPrice">0</span> 원</div>
            </div>

            <div id="recommendationBox" class="recommendation" style="display:none;">
                <strong>💡 AI 건강 추천</strong>
                <p id="recText"></p>
            </div>
        </div>
    </div>

    <script>
        // 가상의 음료 데이터베이스 (사진은 임시 이미지 사용)
        const drinkDB = [
            { name: "핫식스", caffeine: 60, sugar: 29, calories: 120, price: 1500, img: "https://via.placeholder.com/80/000000/FFFFFF?text=Hot6" },
            { name: "몬스터 에너지", caffeine: 100, sugar: 41, calories: 168, price: 2200, img: "https://via.placeholder.com/80/32CD32/FFFFFF?text=Monster" },
            { name: "아이스 아메리카노", caffeine: 150, sugar: 0, calories: 10, price: 2000, img: "https://via.placeholder.com/80/8B4513/FFFFFF?text=Coffee" },
            { name: "박카스", caffeine: 30, sugar: 11, calories: 40, price: 1000, img: "https://via.placeholder.com/80/0000FF/FFFFFF?text=Bacchus" }
        ];

        let isLoggedIn = false;
        let weeklyTotals = { caffeine: 0, sugar: 0, calories: 0, price: 0 };

        // 로그인 토글 기능
        function toggleLogin() {
            isLoggedIn = !isLoggedIn;
            document.getElementById('loginBtn').style.display = isLoggedIn ? 'none' : 'block';
            document.getElementById('logoutBtn').style.display = isLoggedIn ? 'block' : 'none';
            document.getElementById('dashboard').style.display = isLoggedIn ? 'block' : 'none';
            
            if(isLoggedIn && document.getElementById('timeInput').value === "") {
                // 현재 시간을 기본값으로 설정
                let now = new Date();
                document.getElementById('timeInput').value = now.toTimeString().substring(0,5);
            }
        }

        // 음료 검색 기능
        function searchDrink() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = ''; // 초기화

            if (!query) {
                resultsDiv.innerHTML = '<p style="color:#e74c3c;">검색어를 입력해주세요.</p>';
                return;
            }

            const results = drinkDB.filter(d => d.name.includes(query));

            if (results.length === 0) {
                resultsDiv.innerHTML = '<p>해당 음료를 찾을 수 없습니다.</p>';
            } else {
                results.forEach(drink => {
                    resultsDiv.innerHTML += `
                        <div class="drink-card">
                            <img src="${drink.img}" alt="${drink.name}" class="drink-img">
                            <div class="drink-info">
                                <h3>${drink.name}</h3>
                                <p><strong>카페인:</strong> ${drink.caffeine}mg | <strong>당류:</strong> ${drink.sugar}g</p>
                                <p><strong>칼로리:</strong> ${drink.calories}kcal | <strong>가격:</strong> ${drink.price}원</p>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // 기록 추가 및 누적 계산 기능
        function addRecord() {
            const drinkName = document.getElementById('drinkSelect').value;
            const count = parseInt(document.getElementById('countInput').value);
            const time = document.getElementById('timeInput').value;
            
            const drink = drinkDB.find(d => d.name === drinkName);
            
            // 누적 계산
            weeklyTotals.caffeine += drink.caffeine * count;
            weeklyTotals.sugar += drink.sugar * count;
            weeklyTotals.calories += drink.calories * count;
            weeklyTotals.price += drink.price * count;

            // 화면 업데이트
            document.getElementById('totalCaffeine').innerText = weeklyTotals.caffeine;
            document.getElementById('totalSugar').innerText = weeklyTotals.sugar;
            document.getElementById('totalCalories').innerText = weeklyTotals.calories;
            document.getElementById('totalPrice').innerText = weeklyTotals.price;

            // 취침 시간 및 집중 시간 추천 로직
            if (time) {
                const timeParts = time.split(':');
                let hours = parseInt(timeParts[0]);
                let mins = parseInt(timeParts[1]);
                
                // 카페인 반감기 고려: 마신 시간 + 6시간 후 취침 추천
                let bedHours = (hours + 6) % 24;
                let bedTimeStr = `${bedHours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
                
                // 집중 시간 계산 (대략 1.5 ~ 2.5시간)
                let focusHours = count > 1 ? 3 : 2;

                const recBox = document.getElementById('recommendationBox');
                const recText = document.getElementById('recText');
                
                recText.innerHTML = `방금(${time}) ${drinkName}을(를) 마셨군요!<br>
                🧠 <b>최대 집중 가능 시간:</b> 앞으로 약 <b>${focusHours}시간</b> 동안 최고의 효율을 낼 수 있습니다.<br>
                🛌 <b>추천 취침 시간:</b> 카페인 분해를 위해 <b>${bedTimeStr} 이후</b>에 잠자리에 드는 것을 권장합니다.<br>
                <em>(현재 누적 카페인 ${weeklyTotals.caffeine}mg 입니다. 청소년 일일 권장량 125mg 이하를 권장해요!)</em>`;
                
                recBox.style.display = 'block';
            }
            
            alert('기록이 추가되었습니다!');
        }
    </script>
</body>
</html>
